[package]
name = "kadeestudio"
description = "KadeeStudio office suite — desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
kadee-ai.workspace = true
kadee-core.workspace = true
kadee-ui.workspace = true
kadee-commands.workspace = true
eframe.workspace = true
egui.workspace = true
chrono.workspace = true
rfd.workspace = true
open.workspace = true
directories.workspace = true
# The Recent list's bin: deleted files go to the Trash / Recycle Bin.
trash = "5"

# Kadee Markdown: mdcraft's editor (ribbon, preview, slides, templates) in a web view inside
# the Markdown tab. mdcraft runs on macOS and Linux only.
[target.'cfg(unix)'.dependencies]
mdcraft-core.workspace = true
mdcraft-templates.workspace = true
wry = "0.57"
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# wry's web view inside an X11 window needs GTK running next to winit.
gtk = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Use the OpenGL (glow) renderer instead of wgpu — for old GPUs and headless CI.
glow = ["eframe/glow"]
# Write a PNG of the first frames to $EFRAME_SCREENSHOT_TO and exit (docs, CI).
screenshot = ["glow", "eframe/__screenshot"]

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS menu bar: About KadeeStudio opens Settings › About.
muda = { version = "0.17", default-features = false }
# Edit › Paste reads the clipboard (already in the tree through egui-winit).
arboard = { version = "3", default-features = false }
# The Open panel's File type menu (mac_open.rs); the versions winit, wry and rfd already use.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
