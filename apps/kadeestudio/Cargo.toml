[package]
name = "kadeestudio"
description = "KadeeStudio office suite — desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
kadee-core.workspace = true
kadee-ui.workspace = true
kadee-commands.workspace = true
eframe.workspace = true
egui.workspace = true
chrono.workspace = true
rfd.workspace = true
open.workspace = true
directories.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = []
# Use the OpenGL (glow) renderer instead of wgpu — for old GPUs and headless CI.
glow = ["eframe/glow"]
# Write a PNG of the first frames to $EFRAME_SCREENSHOT_TO and exit (docs, CI).
screenshot = ["glow", "eframe/__screenshot"]

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS menu bar: About KadeeStudio opens Settings › About.
muda = { version = "0.17", default-features = false }
# Edit › Paste reads the clipboard (already in the tree through egui-winit).
arboard = { version = "3", default-features = false }
