# Builds installers for macOS, Linux and Windows with the scripts in scripts/.
# Run it by hand (Actions → Release → Run workflow) to get the files as build artifacts,
# or push a tag like v0.2.0 to also publish them as a GitHub release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Run every JavaScript action on Node 24 (Node 20 is deprecated on GitHub's runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # No Finder window layout on a headless runner: DMG_LAYOUT=0 (plain .dmg, no background).
      - name: Build .app and .dmg (universal)
        run: DMG_LAYOUT=0 ./scripts/build-macos.sh --universal
      - uses: actions/upload-artifact@v7
        with:
          name: kadeestudio-macos
          path: |
            dist/*.dmg
            dist/*.sha256

  linux:
    # 22.04 keeps the glibc requirement low, so the build runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev rpm libfuse2
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build .tar.gz, .deb, .rpm and AppImage
        run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kadeestudio-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: WiX toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Build .zip and .msi
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Msi
      - uses: actions/upload-artifact@v7
        with:
          name: kadeestudio-windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/*.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
