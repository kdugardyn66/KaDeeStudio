[package]
name = "mdcraft-core"
description = "mdcraft's Markdown renderer and local preview/editor server (from MarkDown Live)"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
mdcraft-templates.workspace = true
comrak = { version = "0.56", default-features = false, features = ["shortcodes", "attributes"] }
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
ureq = { version = "2", features = ["native-certs"] }
diffy = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
flate2 = "1"

